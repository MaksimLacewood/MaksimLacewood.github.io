<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Norway Fishing</title>
    <!-- Обязательный скрипт Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="greeting">Привет, Рыбак!</h1>
    <p>Твой баланс: 1000 NOK</p>
    
    <button id="mainBtn">Закинуть сеть</button>

    <script>
        // Инициализация Telegram SDK
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем окно на весь экран
        tg.expand();

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
        }

        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready();

        // Обработка нажатия на кнопку
        document.getElementById('mainBtn').addEventListener('click', () => {
            tg.showPopup({
                title: 'Улов!',
                message: 'Вы поймали 2кг сельди.',
                buttons: [{ type: 'close' }]
            });
            // Вибрация (Haptic Feedback)
            tg.HapticFeedback.impactOccurred('medium');
        });
    </script>
</body>
</html>
